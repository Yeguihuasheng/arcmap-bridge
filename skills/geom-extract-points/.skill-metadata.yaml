        完成后把结果与复核情况汇报给我。
      en: |-
        Run skill "从线/面要素提取点（顶点/端点/中点/质心）":
        target: {layer / dataset / output}
        key params: {confirm each item from the skill's question checklist first}
        report the result and the self-check afterwards.
