examples:
  - id: run-gdb-truncate-data
    title:
      zh: 执行「清空GDB要素数据」
      en: Run "清空GDB要素数据"
    description:
      zh: 清空指定地理数据库内要素数据（保留表结构），破坏性操作需二次确认
      en: Truncate feature data in a geodatabase keeping schema; destructive, needs double confirmation
    prompt:
      zh: |-
        请执行技能「清空GDB要素数据」：
        目标 GDB：{x:\xx.gdb}
        关键参数：{按本技能“使用前必须先问询”清单逐项向我确认}
        ⚠️ 这是破坏性操作，请先把要清空的清单列给我、等我明确确认再执行。
        完成后把结果与复核情况汇报给我。
      en: |-
        Run skill "清空GDB要素数据":
        target GDB: {x:\xx.gdb}
        key params: {confirm each item from the skill's question checklist first}
        WARNING: destructive. List what will be truncated and wait for my explicit confirmation first.
        report the result and the self-check afterwards.
