examples:
  - id: run-table-export-csv-excel
    title:
      zh: 执行「属性表导出 CSV / Excel」
      en: Run "属性表导出 CSV / Excel"
    description:
      zh: 在指定目标上按确认参数执行该功能
      en: Execute this feature on the target with confirmed parameters
    prompt:
      zh: |-
        请执行技能「属性表导出 CSV / Excel」：
        目标：{图层 / 数据集 / 工程文件}
        关键参数：{按本技能“使用前必须先问询”清单逐项向我确认}
        完成后把结果与复核情况汇报给我。
      en: |-
        Run skill "属性表导出 CSV / Excel":
        target: {layer / dataset / project file}
        key params: {confirm each item from the skill's question checklist first}
        report the result and the self-check afterwards.
